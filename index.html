<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Full Page App</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #ffffff;
    }

    .iframe-container {
      width: 100vw;
      height: 100vh;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>

<body>

  <div class="iframe-container">
    <iframe 
      src="https://script.google.com/macros/s/AKfycbwxa4cEaMF2GV9dY4kjKxbB8wcJdWhPnQUoPYkysiguNVoc1LHxnrUQT9n_5qNBQ8IskQ/exec"
      scrolling="no"
      allowfullscreen>
    </iframe>
  </div>

</body>
</html>
